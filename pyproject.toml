[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odbpp"
version = "0.1.0"
description = "ODB++ v8.1 parser: archive to normalised, all-positive, millimetre polygon model"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "kekesjtu", email = "mydearlong@sjtu.edu.cn" }]
dependencies = [
    # Core, not optional: ``odbpp/__init__.py`` imports the geometry layer
    # unconditionally, so every command -- including the pure-inventory ones --
    # needs pyclipper importable.  Leaving it in an extra made a plain
    # a base installation produce a package that cannot even be imported.
    "pyclipper>=1.3.0.post6",
]

[project.optional-dependencies]
# Validation/topology helpers used by the tests and tools, not by the pipeline
# itself; the parser and the exporter no longer depend on them at runtime.
geometry = ["shapely>=2.0", "numpy>=1.26"]
parse = ["lxml>=5.0"]
tools = [
    "matplotlib>=3.9",
    "pypdf>=4.0",
]
test = ["pytest>=8.0"]

[project.scripts]
odbpp = "odbpp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --basetemp keeps scratch trees inside the (gitignored) build/ directory instead
# of the system temp dir; that also avoids a Windows permission trap when a
# previous run's temp root is left locked.
addopts = "-q --basetemp=build/pytest-tmp"
filterwarnings = ["error"]
