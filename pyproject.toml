[project]
name = "pcb-development"
version = "0.1.0"
description = "Independent rust PCB development workspace"
requires-python = ">=3.10"
dependencies = ['pcbkit-rust', 'pcbeq-rust']

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ['packages/pcbkit-rust', 'packages/pcbeq-rust']

[tool.uv.sources]
pcbkit-rust = { workspace = true }
pcbeq-rust = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [".", "tests", "tests/rust"]
testpaths = ["tests/rust", "tests/distribution"]
addopts = "-q --basetemp=tmp/pytest-tmp -p conftest"
filterwarnings = ["error"]
