[project]
name = "pcb-development"
version = "0.1.0"
description = "Private development workspace for pcbkit and pcbeq"
requires-python = ">=3.10"
dependencies = ["pcbkit", "pcbeq"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/pcbkit", "packages/pcbeq"]

[tool.uv.sources]
pcbkit = { workspace = true }
pcbeq = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [".", "packages/pcbeq/tests", "packages/pcbkit/tests"]
testpaths = ["tests", "packages/pcbkit/tests", "packages/pcbeq/tests"]
addopts = "-q --basetemp=tmp/pytest-tmp"
filterwarnings = ["error"]
