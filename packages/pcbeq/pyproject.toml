[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbeq"
version = "0.1.0"
description = "PCB thermal material equivalence from intermediate JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.12,<3", "pyclipper>=1.3.0.post6", "shapely>=2.0", "numpy>=1.26", "matplotlib>=3.9"]

[project.scripts]
pcbeq = "pcbeq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
