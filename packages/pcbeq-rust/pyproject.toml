[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pcbeq-rust"
version = "0.1.0"
description = "Process pipeline and MaterialMap charts for the standalone pcbeq executable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12,<3", "numpy>=1.26", "matplotlib>=3.9"]

[project.scripts]
pcbeq-rust = "pcbeq_rust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/pcbeq_rust"]

[tool.hatch.build.targets.sdist]
include = ["python/pcbeq_rust", "README.md", "pyproject.toml"]

[tool.uv]
cache-keys = [
    { file = "python/**/*.py" },
    { file = "pyproject.toml" },
]
