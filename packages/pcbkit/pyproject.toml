[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbkit"
version = "0.1.0"
description = "ODB++ parser and positive polygon exporter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.12,<3", "pyclipper>=1.3.0.post6"]

[project.scripts]
pcbkit = "pcbkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
