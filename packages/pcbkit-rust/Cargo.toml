[package]
name = "pcbkit-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ODB++ geometry numerical kernels with Python bindings"
license.workspace = true

[lib]
name = "_pcbkit_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
clipper2-rust = "1.2"
pyo3.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
