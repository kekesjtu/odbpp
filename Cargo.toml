[workspace]
members = ["packages/pcbkit-rust", "packages/pcbeq-rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310"] }

[profile.release]
lto = "thin"
codegen-units = 1
